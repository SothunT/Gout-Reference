<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gout food guide: which foods are safe, light, medium or high in purine. English, Tiếng Việt, 廣東話.">
<meta name="theme-color" content="#24427E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gout Foods">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Gout Food Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<style>
/* Layout: a big-button control panel (language, color level, food type, search) above a food grid grouped by level.
   Four traffic-light level colors carry the meaning; an ink-blue accent is used only for controls. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#17202B; --ink-soft:#4A5566; --line:#D3DAE3;
  --accent:#24427E; --accent-ink:#FFFFFF; --focus:#1E6BFF; --shadow:rgba(16,24,40,.18);
  --l1:#2E7D32; --l1-ink:#FFFFFF; --l1-bg:#E4F2E5; --l1-line:#B5DAB8;
  --l2:#F2C230; --l2-ink:#2B2200; --l2-bg:#FFF5D2; --l2-line:#E9D184;
  --l3:#EE7A1B; --l3-ink:#2B1500; --l3-bg:#FFE7D3; --l3-line:#F0BB8C;
  --l4:#C62828; --l4-ink:#FFFFFF; --l4-bg:#FBE0DE; --l4-line:#EBA7A2;
  --font:"Be Vietnam Pro","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --scale:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141B; --surface:#18202A; --ink:#ECF0F4; --ink-soft:#A8B3C1; --line:#2C3746;
    --accent:#9DB8F2; --accent-ink:#0D1830; --focus:#7FB0FF; --shadow:rgba(0,0,0,.5);
    --l1:#5DBB63; --l1-ink:#06210A; --l1-bg:#15301B; --l1-line:#285A31;
    --l2:#F2CC4D; --l2-ink:#2B2200; --l2-bg:#322A0D; --l2-line:#5E4F1A;
    --l3:#F59A4C; --l3-ink:#2B1500; --l3-bg:#392311; --l3-line:#6A3F1C;
    --l4:#F0625D; --l4-ink:#2A0505; --l4-bg:#391615; --l4-line:#6E2A28;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#18202A; --ink:#ECF0F4; --ink-soft:#A8B3C1; --line:#2C3746;
  --accent:#9DB8F2; --accent-ink:#0D1830; --focus:#7FB0FF; --shadow:rgba(0,0,0,.5);
  --l1:#5DBB63; --l1-ink:#06210A; --l1-bg:#15301B; --l1-line:#285A31;
  --l2:#F2CC4D; --l2-ink:#2B2200; --l2-bg:#322A0D; --l2-line:#5E4F1A;
  --l3:#F59A4C; --l3-ink:#2B1500; --l3-bg:#392311; --l3-line:#6A3F1C;
  --l4:#F0625D; --l4-ink:#2A0505; --l4-bg:#391615; --l4-line:#6E2A28;
  color-scheme:dark;
}

html{font-size:calc(19px * var(--scale));-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.5}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px)}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center;justify-content:space-between;padding-block:1rem 1.1rem}
.brand{display:flex;gap:.8rem;align-items:center;min-width:0;flex:1 1 20rem}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:2.5rem;height:2.5rem;flex:none}
.mark i{border-radius:50%}
.mark i:nth-child(1){background:var(--l1)}.mark i:nth-child(2){background:var(--l2)}
.mark i:nth-child(3){background:var(--l3)}.mark i:nth-child(4){background:var(--l4)}
h1{font-size:1.55rem;font-weight:800;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:.2rem 0 0;color:var(--ink-soft);font-size:.92rem;text-wrap:balance}
.controls{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center}
.seg{display:flex;border:1.5px solid var(--line);border-radius:14px;padding:3px;background:var(--bg);gap:3px}
.seg button{border:0;background:transparent;padding:.3rem .8rem;border-radius:10px;font-weight:600;font-size:.92rem;min-height:46px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.langs{flex:1 1 auto}
.langs button{flex:1 1 0}
.size{display:flex;align-items:center;gap:.4rem}
.size span{font-size:.82rem;color:var(--ink-soft);font-weight:600}
.size button{min-width:46px;font-weight:800}
.size button:disabled{opacity:.35;cursor:default}

/* Control panel */
.panel{display:grid;gap:.7rem;padding-block:1.2rem .6rem}
.label{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin:.3rem 0 0}
.levels{display:grid;grid-template-columns:1fr;gap:.45rem}
.v0{--lvl:var(--accent);--lvl-ink:var(--accent-ink);--lvl-bg:var(--surface);--lvl-line:var(--line)}
.v1{--lvl:var(--l1);--lvl-ink:var(--l1-ink);--lvl-bg:var(--l1-bg);--lvl-line:var(--l1-line)}
.v2{--lvl:var(--l2);--lvl-ink:var(--l2-ink);--lvl-bg:var(--l2-bg);--lvl-line:var(--l2-line)}
.v3{--lvl:var(--l3);--lvl-ink:var(--l3-ink);--lvl-bg:var(--l3-bg);--lvl-line:var(--l3-line)}
.v4{--lvl:var(--l4);--lvl-ink:var(--l4-ink);--lvl-bg:var(--l4-bg);--lvl-line:var(--l4-line)}
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.1rem .55rem;text-align:left;
  padding:.5rem .65rem;border-radius:14px;border:2px solid var(--lvl-line);background:var(--lvl-bg);min-height:3.7rem}
.lvl .dot{grid-row:1 / span 2}
.lvl .nm{font-weight:700;line-height:1.2}
.lvl .ds{grid-column:2 / span 2;font-size:.78rem;line-height:1.3;color:var(--ink-soft)}
.lvl .cnt{font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums;padding:.05rem .5rem;border-radius:999px;background:var(--surface);color:var(--ink);border:1px solid var(--lvl-line)}
.lvl[aria-pressed="true"]{background:var(--lvl);color:var(--lvl-ink);border-color:var(--ink);box-shadow:0 0 0 2px var(--lvl) inset}
.lvl[aria-pressed="true"] .ds{color:inherit}
.lvl.v0[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--accent-ink)}
.lvl:not(.v0)[aria-pressed="true"] .dot{background:var(--lvl-ink);color:var(--lvl)}
.lvl.v0{min-height:3.4rem}
.dot{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--lvl);color:var(--lvl-ink);font-weight:800;font-size:1rem;line-height:1}
.v0 .dot{background:conic-gradient(var(--l1) 0 25%,var(--l2) 0 50%,var(--l3) 0 75%,var(--l4) 0)}

.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.45rem}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;padding:.5rem .2rem;min-height:4.3rem;
  border:2px solid var(--line);border-radius:14px;background:var(--surface);font-size:.8rem;font-weight:600;line-height:1.15;text-align:center;overflow-wrap:anywhere;min-width:0}
.cat .ic{font-size:1.6rem;line-height:1}
.cat[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.search{position:relative;margin-top:.3rem}
.search svg{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);width:1.2rem;height:1.2rem;color:var(--ink-soft);pointer-events:none}
.search input{width:100%;font:inherit;font-size:1rem;padding:.7rem 3.2rem .7rem 2.7rem;min-height:54px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--ink-soft);opacity:1}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.clear{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:50%;background:var(--bg);font-size:1.1rem;font-weight:700}

@media (min-width:800px){
  .levels{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lvl{min-height:4.6rem}
  .cats{grid-template-columns:repeat(8,minmax(0,1fr))}
}

/* Results */
.status{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem;padding-block:.7rem;border-top:1px solid var(--line);margin-top:.6rem}
.status p{margin:0;font-weight:600;color:var(--ink-soft)}
.reset{border:2px solid var(--accent);color:var(--accent);background:transparent;border-radius:12px;padding:.35rem .9rem;font-weight:700;min-height:44px}
.group{margin-bottom:1.6rem}
.ghead{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);display:flex;align-items:center;gap:.6rem;
  padding-block:.6rem .5rem;margin-bottom:.55rem;border-bottom:3px solid var(--lvl,var(--line))}
.ghead .gic{font-size:1.5rem;line-height:1}
.ghead h2{font-size:1.15rem;margin:0;font-weight:800;line-height:1.25;min-width:0}
.ghead h2 small{display:block;font-size:.8rem;font-weight:500;color:var(--ink-soft)}
.ghead .gc{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:.5rem}
.food{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;align-items:start;padding:.65rem .7rem;border-radius:12px;
  background:var(--lvl-bg);border:1.5px solid var(--lvl-line);min-width:0}
.food.is-open{grid-column:1 / -1}
.pic{position:relative;width:3rem;height:3rem;padding:2px;border-radius:10px;border:1.5px solid var(--lvl-line);background:var(--surface);flex:none}
.pic img{display:block;width:100%;height:100%;object-fit:cover;border-radius:8px}
.pic .zoom{position:absolute;right:-.4rem;bottom:-.4rem;width:1.3rem;height:1.3rem;border-radius:50%;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.85rem;line-height:1;border:2px solid var(--surface)}
.pic[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.fig{grid-column:1 / -1;margin:.1rem 0 0;padding:.5rem;border-radius:10px;background:var(--surface);border:1px solid var(--lvl-line);display:grid;gap:.5rem}
.fig-img{display:block;width:100%;border:0;padding:0;background:transparent;cursor:zoom-out}
.fig img{display:block;margin-inline:auto;max-width:100%;border-radius:8px}
.fig img.is-photo{width:100%;max-height:70vh;object-fit:contain}
.fig img.is-ill{width:min(11rem,60%);height:auto;padding-block:.6rem}
.fig figcaption{display:flex;flex-wrap:wrap;gap:.4rem .8rem;align-items:center;justify-content:space-between;font-size:.76rem;color:var(--ink-soft)}
.fig figcaption span{min-width:0;overflow-wrap:anywhere}
.fig figcaption a{color:var(--accent)}
.fig-close{border:2px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:.3rem .8rem;font-weight:700;font-size:.85rem;min-height:44px;margin-left:auto}
.hint{display:flex;align-items:center;gap:.5rem;margin:.1rem 0 0;font-size:.84rem;color:var(--ink-soft)}
.hint-pic{display:grid;place-items:center;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.85rem;line-height:1;flex:none}
.food .txt{min-width:0}
.food h3{font-size:1.08rem;font-weight:600;margin:0;line-height:1.3;overflow-wrap:anywhere}
.food .alt{margin:.15rem 0 0;font-size:.82rem;color:var(--ink-soft);overflow-wrap:anywhere}
.food .note{margin:.4rem 0 0;font-size:.84rem;line-height:1.4}
.badge{flex:none;display:inline-flex;align-items:center;gap:.3rem;background:var(--lvl);color:var(--lvl-ink);font-weight:700;font-size:.76rem;
  padding:.18rem .6rem .18rem .22rem;border-radius:999px;white-space:nowrap;margin-top:.1rem}
.badge b{display:grid;place-items:center;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--lvl-ink);color:var(--lvl);font-size:.75rem;line-height:1}
.empty{padding:1.5rem;border:2px dashed var(--line);border-radius:14px;text-align:center;color:var(--ink-soft);margin-bottom:2rem}

/* About */
.about{display:grid;gap:1.6rem;padding-block:1.6rem 2rem;border-top:1px solid var(--line)}
@media (min-width:800px){.about{grid-template-columns:1fr 1fr}}
.about h2{font-size:1.15rem;font-weight:800;margin:0 0 .7rem}
.legend,.tips{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.legend li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.1rem .7rem;align-items:center}
.legend .dot{grid-row:1 / span 2}
.legend b{line-height:1.25}
.legend span{font-size:.84rem;color:var(--ink-soft);line-height:1.35}
.small{font-size:.8rem;color:var(--ink-soft);margin:.8rem 0 0}
.tips li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.6rem;font-size:.92rem;line-height:1.45}
.tips li::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--accent);margin-top:.5rem}
.disc{grid-column:1 / -1;margin:0;padding:.9rem 1rem;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.86rem;color:var(--ink-soft)}

#toTop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;border:0;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);padding:.6rem 1.1rem;font-weight:700;min-height:48px;box-shadow:0 6px 18px var(--shadow)}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div>
        <h1 data-t="title">Gout Food Guide</h1>
        <p class="sub" data-t="sub">What's safe to eat, and what can bring on a gout flare.</p>
      </div>
    </div>
    <div class="controls">
      <div class="seg langs" role="group" aria-label="Language">
        <button type="button" id="lang-en" data-lang="en" lang="en">English</button>
        <button type="button" id="lang-vi" data-lang="vi" lang="vi">Tiếng Việt</button>
        <button type="button" id="lang-zh" data-lang="zh" lang="zh-HK">廣東話</button>
      </div>
      <div class="size">
        <span data-t="size">Text size</span>
        <div class="seg">
          <button type="button" id="size-down" aria-label="Smaller text">A−</button>
          <button type="button" id="size-up" aria-label="Larger text">A+</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel" aria-label="Filters">
    <p class="label" data-t="byLevel">Show by color</p>
    <div class="levels" id="levels"></div>
    <p class="label" data-t="byCat">Show by food type</p>
    <div class="cats" id="cats"></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input type="search" id="q" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search">
      <button type="button" class="clear" id="clear" aria-label="Clear search" hidden>✕</button>
    </div>
    <p class="hint"><span class="hint-pic" aria-hidden="true">+</span><span data-t="picHint">Tap a picture to see it bigger.</span></p>
  </section>

  <div class="status">
    <p id="status" aria-live="polite"></p>
    <button type="button" class="reset" id="reset" data-t="reset" hidden>Show everything</button>
  </div>

  <div id="list"></div>

  <section class="about">
    <div>
      <h2 data-t="legendTitle">What the colors mean</h2>
      <ul class="legend" id="legend"></ul>
      <p class="small" data-t="source"></p>
    </div>
    <div>
      <h2 data-t="tipsTitle">Everyday tips</h2>
      <ul class="tips" id="tips"></ul>
    </div>
    <p class="disc" data-t="disc"></p>
  </section>
</main>

<button type="button" id="toTop" hidden>↑ <span data-t="top">Top</span></button>

/* ---------- Prepare data ---------- */
function norm(s){
  return String(s).toLowerCase().replace(/đ/g,"d").normalize("NFD").replace(/[̀-ͯ]/g,"");
}
function slug(s){
  return norm(s).replace(/&/g," and ").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
var FOODS = F.map(function(r,i){
  return {id:slug(r[2]), cat:r[0], lv:r[1], n:[r[2],r[3],r[4]], note:r[5]||null, i:i, ci:CATS.indexOf(r[0]), s:norm(r[2]+" | "+r[3]+" | "+r[4])};
});
var BYID = {}; FOODS.forEach(function(f){ BYID[f.id] = f; });

/* Photos: filled in on GitHub by the "Download food photos" step. Until then, illustrations show. */
var PHOTOS = {};
var OPEN = {};
function thumbSrc(id){ return PHOTOS[id] ? "Images/photos/thumbs/"+id+".jpg" : "Images/illustrations/small/"+(ILL[id]||"fork-and-knife-with-plate")+".webp"; }
function fullSrc(id){ return PHOTOS[id] ? "Images/photos/"+id+".jpg" : "Images/illustrations/"+(ILL[id]||"fork-and-knife-with-plate")+".webp"; }
function illSrc(id, small){ return "Images/illustrations/"+(small?"small/":"")+(ILL[id]||"fork-and-knife-with-plate")+".webp"; }

/* ---------- State ---------- */
var store = {
  get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}
};
var LANGS = ["en","vi","zh"];
var ALIAS = {en:"en", vi:"vi", zh:"zh", yue:"zh", canto:"zh", cantonese:"zh", vietnamese:"vi", english:"en"};
var SCALES = [0.9, 1, 1.15, 1.3, 1.5];

var lang = (function(){
  var h = ""; try{ h = (location.hash||"").slice(1).toLowerCase(); }catch(e){}
  if(ALIAS[h]) return ALIAS[h];
  var s = store.get("gfg-lang"); if(LANGS.indexOf(s) > -1) return s;
  var nav = (navigator.language||"").toLowerCase();
  if(nav.indexOf("vi") === 0) return "vi";
  if(nav.indexOf("zh") === 0 || nav.indexOf("yue") === 0) return "zh";
  return "en";
})();
var si = parseInt(store.get("gfg-size"),10); if(!(si >= 0 && si < SCALES.length)) si = 1;
var state = {level:0, cat:"all", q:""};

var $ = function(id){return document.getElementById(id);};
var elLevels=$("levels"), elCats=$("cats"), elList=$("list"), elQ=$("q"), elClear=$("clear"),
    elStatus=$("status"), elReset=$("reset"), elLegend=$("legend"), elTips=$("tips"), elTop=$("toTop");

function T(k){return L[lang][k];}
function li(){return LANGS.indexOf(lang);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fill(s,o){return s.replace(/\{(\w+)\}/g,function(m,k){return o[k];});}

/* ---------- Build buttons once ---------- */
for(var lv=0; lv<=4; lv++){
  var b = document.createElement("button");
  b.type="button"; b.className="lvl v"+lv; b.dataset.lv=lv; b.id="lvl-"+lv;
  b.innerHTML='<span class="dot" aria-hidden="true">'+SYM[lv]+'</span><span class="nm"></span><span class="cnt"></span><span class="ds"></span>';
  elLevels.appendChild(b);
}
["all"].concat(CATS).forEach(function(c){
  var b = document.createElement("button");
  b.type="button"; b.className="cat"; b.dataset.cat=c; b.id="cat-"+c;
  b.innerHTML='<span class="ic" aria-hidden="true">'+ICON[c]+'</span><span class="cl"></span>';
  elCats.appendChild(b);
});

/* ---------- Render ---------- */
function renderStatic(){
  document.documentElement.lang = {en:"en", vi:"vi", zh:"zh-HK"}[lang];
  document.title = T("title");
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = T(el.dataset.t); });
  elQ.placeholder = T("search");
  document.querySelectorAll("[data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.lang===lang ? "true":"false"); });
  elCats.querySelectorAll(".cat").forEach(function(b){ b.querySelector(".cl").textContent = T("cats")[b.dataset.cat]; });
  var lvls = T("levels");
  elLegend.innerHTML = [1,2,3,4].map(function(v){
    return '<li class="v'+v+'"><span class="dot" aria-hidden="true">'+SYM[v]+'</span><b>'+esc(lvls[v].name)+' · '+esc(lvls[v].desc)+'</b><span>'+esc(lvls[v].range)+'</span></li>';
  }).join("");
  elTips.innerHTML = T("tips").map(function(t){return "<li>"+esc(t)+"</li>";}).join("");
}

function renderControls(){
  var lvls = T("levels");
  var base = FOODS.filter(function(f){return state.cat==="all" || f.cat===state.cat;});
  elLevels.querySelectorAll(".lvl").forEach(function(b){
    var v = +b.dataset.lv;
    b.querySelector(".nm").textContent = v ? lvls[v].name : T("allName");
    b.querySelector(".ds").textContent = v ? lvls[v].desc : T("allDesc");
    b.querySelector(".cnt").textContent = v ? base.filter(function(f){return f.lv===v;}).length : base.length;
    b.setAttribute("aria-pressed", (!state.q && state.level===v) ? "true":"false");
  });
  elCats.querySelectorAll(".cat").forEach(function(b){
    b.setAttribute("aria-pressed", (!state.q && state.cat===b.dataset.cat) ? "true":"false");
  });
  elClear.hidden = !state.q;
  elReset.hidden = !(state.q || state.level || state.cat!=="all");
}

function figureHTML(f){
  var k = li(), p = PHOTOS[f.id], cap;
  if(p){
    var who = [p.artist, p.license].filter(Boolean).map(esc).join(", ");
    cap = esc(T("photo")) + (who ? ": " + who : "") + (p.url ? ' · <a href="'+esc(p.url)+'" target="_blank" rel="noopener">Wikimedia Commons</a>' : "");
  } else {
    cap = esc(T("illus"));
  }
  return '<button type="button" class="fig-img" data-close="'+f.id+'" aria-label="'+esc(T("close"))+'">'+
         '<img src="'+fullSrc(f.id)+'" data-fallback="'+illSrc(f.id)+'" alt="'+esc(f.n[k])+'" class="'+(p?"is-photo":"is-ill")+'"></button>'+
         '<figcaption><span>'+cap+'</span><button type="button" class="fig-close" data-close="'+f.id+'">✕ '+esc(T("close"))+'</button></figcaption>';
}

function card(f){
  var k = li(), lvls = T("levels"), open = !!OPEN[f.id];
  var alt = [0,1,2].filter(function(j){return j!==k;}).map(function(j){return f.n[j];}).join(" · ");
  var note = f.note ? '<p class="note">'+esc(N[f.note][k])+'</p>' : "";
  var langAttr = function(j){return ' lang="'+["en","vi","zh-HK"][j]+'"';};
  return '<article class="food v'+f.lv+(open?' is-open':'')+'">'+
         '<button type="button" class="pic" data-pic="'+f.id+'" aria-expanded="'+open+'" aria-controls="fig-'+f.id+'" aria-label="'+esc(fill(T("showPic"),{n:f.n[k]}))+'">'+
           '<img src="'+thumbSrc(f.id)+'" data-fallback="'+illSrc(f.id,true)+'" alt="" loading="lazy" width="56" height="56">'+
           '<span class="zoom" aria-hidden="true">'+(open?"−":"+")+'</span></button>'+
         '<div class="txt"><h3'+langAttr(k)+'>'+esc(f.n[k])+'</h3><p class="alt">'+esc(alt)+'</p>'+note+'</div>'+
         '<span class="badge"><b aria-hidden="true">'+SYM[f.lv]+'</b>'+esc(lvls[f.lv].short)+'</span>'+
         '<figure class="fig" id="fig-'+f.id+'"'+(open?'':' hidden')+'>'+(open?figureHTML(f):'')+'</figure>'+
         '</article>';
}

function renderList(){
  var nq = norm(state.q.trim());
  var items = FOODS.filter(function(f){
    if(nq) return f.s.indexOf(nq) > -1;
    return (state.level===0 || f.lv===state.level) && (state.cat==="all" || f.cat===state.cat);
  });
  var groups = [], lvls = T("levels");
  if(state.level===0 || nq){
    [1,2,3,4].forEach(function(v){
      var g = items.filter(function(f){return f.lv===v;}).sort(function(a,b){return a.ci-b.ci || a.i-b.i;});
      if(g.length) groups.push({cls:"v"+v, icon:'<span class="dot" aria-hidden="true">'+SYM[v]+'</span>', title:lvls[v].name, sub:lvls[v].desc, items:g});
    });
  } else {
    CATS.forEach(function(c){
      var g = items.filter(function(f){return f.cat===c;});
      if(g.length) groups.push({cls:"v"+state.level, icon:'<span class="gic" aria-hidden="true">'+ICON[c]+'</span>', title:T("cats")[c], sub:"", items:g});
    });
  }
  elStatus.textContent = nq ? fill(T("match"),{n:items.length, q:state.q.trim()}) : fill(T("showing"),{n:items.length});
  if(!items.length){ elList.innerHTML = '<p class="empty">'+esc(T("none"))+'</p>'; return; }
  elList.innerHTML = groups.map(function(g){
    return '<section class="group '+g.cls+'"><div class="ghead">'+g.icon+'<h2>'+esc(g.title)+(g.sub?'<small>'+esc(g.sub)+'</small>':'')+'</h2><span class="gc">'+g.items.length+'</span></div>'+
           '<div class="grid">'+g.items.map(card).join("")+'</div></section>';
  }).join("");
}

function render(){ renderControls(); renderList(); }

function applySize(){
  document.documentElement.style.setProperty("--scale", SCALES[si]);
  $("size-down").disabled = si===0;
  $("size-up").disabled = si===SCALES.length-1;
}

/* ---------- Events ---------- */
document.querySelectorAll("[data-lang]").forEach(function(b){
  b.addEventListener("click", function(){
    lang = b.dataset.lang; store.set("gfg-lang", lang);
    renderStatic(); render();
  });
});
elLevels.addEventListener("click", function(e){
  var b = e.target.closest(".lvl"); if(!b) return;
  state.level = +b.dataset.lv; state.q = ""; elQ.value = ""; render();
});
elCats.addEventListener("click", function(e){
  var b = e.target.closest(".cat"); if(!b) return;
  state.cat = b.dataset.cat; state.q = ""; elQ.value = ""; render();
});
elQ.addEventListener("input", function(){
  state.q = elQ.value;
  if(state.q.trim()){ state.level = 0; state.cat = "all"; }
  render();
});
elQ.addEventListener("keydown", function(e){ if(e.key==="Enter") elQ.blur(); });
elClear.addEventListener("click", function(){ state.q=""; elQ.value=""; render(); elQ.focus(); });
elReset.addEventListener("click", function(){ state.q=""; elQ.value=""; state.level=0; state.cat="all"; render(); });
$("size-down").addEventListener("click", function(){ if(si>0){si--; store.set("gfg-size",si); applySize();} });
$("size-up").addEventListener("click", function(){ if(si<SCALES.length-1){si++; store.set("gfg-size",si); applySize();} });
elTop.addEventListener("click", function(){ window.scrollTo(0,0); });
window.addEventListener("scroll", function(){ elTop.hidden = window.scrollY < 700; }, {passive:true});
window.addEventListener("hashchange", function(){
  var h = (location.hash||"").slice(1).toLowerCase();
  if(ALIAS[h]){ lang = ALIAS[h]; renderStatic(); render(); }
});

function togglePic(id){
  var f = BYID[id]; if(!f) return;
  var art = elList.querySelector('[data-pic="'+id+'"]'); if(!art) return;
  art = art.closest(".food");
  var fig = art.querySelector(".fig"), btn = art.querySelector(".pic");
  OPEN[id] = !OPEN[id];
  if(OPEN[id]){ fig.innerHTML = figureHTML(f); fig.hidden = false; }
  else { fig.hidden = true; fig.innerHTML = ""; }
  art.classList.toggle("is-open", !!OPEN[id]);
  btn.setAttribute("aria-expanded", OPEN[id] ? "true" : "false");
  btn.querySelector(".zoom").textContent = OPEN[id] ? "−" : "+";
  if(!OPEN[id]) btn.focus({preventScroll:true});
}
elList.addEventListener("click", function(e){
  var b = e.target.closest("[data-pic],[data-close]"); if(!b) return;
  togglePic(b.dataset.pic || b.dataset.close);
});
/* If a photo is missing, show the illustration instead */
elList.addEventListener("error", function(e){
  var im = e.target;
  if(im.tagName === "IMG" && im.dataset.fallback && im.getAttribute("src") !== im.dataset.fallback){
    im.src = im.dataset.fallback; im.className = "is-ill";
  }
}, true);

applySize(); renderStatic(); render();
try{
  fetch("Images/photos/credits.json", {cache:"no-cache"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if(j && typeof j === "object"){ PHOTOS = j; renderList(); } })
    .catch(function(){});
}catch(e){}
})();
</script>
</body>
</html>
